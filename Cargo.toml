[package]
name = "starkom-bluesky"
version = "2.2.0"
description = "The BlueSky scalar field used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/bluesky.git"
readme = "README.md"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.102"
ff = { version = "0.13.1", features = ["derive"] }
getrandom = { version = "0.2", features = ["js"] }
primitive-types = "0.14.0"
rand_core = "^0.6"
subtle = "2.6.1"
