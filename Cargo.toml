[package]
name = "starkom-bluesky"
version = "3.3.1"
description = "The BlueSky scalar field used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/bluesky.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
starkom-ff = "2.5.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom_old = { package = "getrandom", version = "0.2.17", features = ["js"] }
primitive-types = "0.14.0"
rand_core = "^0.10.1"
subtle = "2.6.1"
